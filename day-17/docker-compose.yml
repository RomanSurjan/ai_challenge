name: day17

services:
  mcp-server:
    build:
      context: .
    image: day17-agent:local
    container_name: day17-mcp-server
    command: ["/usr/local/bin/mcp-server"]
    entrypoint: []
    restart: unless-stopped
    environment:
      MCP_ADDR: ":8081"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - day17-internal
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent-app:
    build:
      context: .
    image: day17-agent:local
    container_name: day17-agent-app
    restart: unless-stopped
    command: ["-serve", "-addr", ":8080"]
    environment:
      APP_ADDR: ":8080"
      MCP_ENDPOINT: "http://mcp-server:8081/mcp"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
    depends_on:
      mcp-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - day17-internal
    volumes:
      - day17-data:/data
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  day17-internal:
    name: day17-internal

volumes:
  day17-data:
    name: day17-data

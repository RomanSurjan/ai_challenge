<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 17 · GitHub MCP Agent</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#0e1c2f;--line:#29415e;--text:#edf5ff;--muted:#9cb0c8;--a:#61d8c3;--b:#78a9ff;--err:#ff8d9a}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px/1.45 system-ui,sans-serif;background:radial-gradient(circle at 10% 10%,#153359 0,transparent 35%),var(--bg);color:var(--text)}main{max-width:1100px;margin:auto;padding:44px 24px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}h1{font-size:clamp(30px,5vw,54px);line-height:1;margin:0;letter-spacing:-.04em}header p{color:var(--muted);max-width:480px}.badge{color:var(--a);border:1px solid #2d6e68;border-radius:999px;padding:8px 13px;white-space:nowrap}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.card{background:rgba(14,28,47,.9);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 20px 60px #0006}label{display:block;color:var(--muted);margin-bottom:8px}textarea{width:100%;min-height:125px;resize:vertical;background:#081423;color:var(--text);border:1px solid #36516f;border-radius:12px;padding:14px;font:inherit}button{margin-top:12px;width:100%;border:0;border-radius:12px;padding:13px 16px;font-weight:750;background:linear-gradient(90deg,var(--a),var(--b));color:#05111d;cursor:pointer}button:disabled{opacity:.5;cursor:wait}h2{font-size:16px;margin:0 0 14px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.answer{white-space:pre-wrap;min-height:205px}.trace{display:grid;gap:9px}.event{border-left:3px solid var(--b);background:#091625;border-radius:8px;padding:10px 12px}.event strong{display:block;color:var(--a);font-size:13px}.event pre{white-space:pre-wrap;word-break:break-word;margin:7px 0 0;color:#c7d7ea;font-size:12px}.empty{color:var(--muted)}.error{color:var(--err)}@media(max-width:800px){header{display:block}.badge{display:inline-block;margin-top:12px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <header><div><h1>GitHub MCP Agent</h1><p>Модель сама выбирает инструмент, агент вызывает удалённый MCP-сервер и возвращает GitHub-данные модели.</p></div><span class="badge">Streamable HTTP · GitHub REST API</span></header>
  <section class="grid">
    <div class="card"><label for="message">Естественный запрос</label><textarea id="message">Расскажи по-русски об актуальном состоянии репозитория modelcontextprotocol/go-sdk: назначение, основной язык, ветка по умолчанию, звёзды, форки, открытые issues, лицензия и даты последнего обновления.</textarea><button id="send">Отправить агенту</button><h2 style="margin-top:24px">Финальный ответ</h2><div id="answer" class="answer empty">Ответ появится здесь.</div></div>
    <div class="card"><h2>Трассировка MCP-вызова</h2><div id="trace" class="trace"><div class="empty">Ожидается запрос.</div></div></div>
  </section>
</main><script>
const send=document.querySelector('#send'), answer=document.querySelector('#answer'), trace=document.querySelector('#trace');
send.addEventListener('click',async()=>{send.disabled=true;answer.className='answer empty';answer.textContent='Агент думает…';trace.innerHTML='<div class="empty">tools/list → решение модели → tools/call → финальный ответ</div>';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:document.querySelector('#message').value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Ошибка запроса');answer.className='answer';answer.textContent=data.content;trace.innerHTML='';for(const e of data.trace||[]){const box=document.createElement('div');box.className='event';const title=document.createElement('strong');title.textContent=e.stage+(e.tool?' · '+e.tool:'');box.append(title);const msg=document.createElement('div');msg.textContent=e.message;box.append(msg);const details=e.arguments||e.result;if(details){const pre=document.createElement('pre');pre.textContent=JSON.stringify(details,null,2);box.append(pre)}trace.append(box)}}catch(e){answer.className='answer error';answer.textContent=e.message}finally{send.disabled=false}});
</script></body></html>

services:
  mcp-server:
    build:
      context: .
    container_name: day16-mcp-server
    restart: unless-stopped
    environment:
      MCP_ADDR: ":8080"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777

